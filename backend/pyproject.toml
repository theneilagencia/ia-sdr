[project]
name = "ia-sdr-backend"
version = "0.1.0"
description = "AI Sales Workforce - multi-tenant platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "anthropic>=0.69",
    # Cliente HTTP do lado de fora: a integração com o RAVI fala HTTP. Já vinha
    # instalado como dependência do SDK da Anthropic; depender disso por
    # transitividade é o tipo de coisa que quebra numa atualização dele.
    "httpx>=0.27",
    # Opcional em uso, obrigatório na instalação: é o backend compartilhado do
    # limitador de requisições (`REDIS_URL`). Sem a variável, nada é importado —
    # mas deixar a biblioteca fora do pacote faria "ligar o Redis" virar
    # "reconstruir a imagem", que é o tipo de passo que ninguém quer descobrir
    # no meio de um incidente.
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts` não é instalado junto com o pacote, mas a suíte usa o bootstrap
# de roles para montar o banco de teste igual ao de produção.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/Query() em default de argumento é o idioma do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Migration gerada pelo autogenerate: não vale reformatar à mão.
"alembic/versions/0001_foundation.py" = ["E501"]
"alembic/versions/0004_jobs.py" = ["E501"]
