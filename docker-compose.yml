services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ia_sdr
      POSTGRES_PASSWORD: ia_sdr
      POSTGRES_DB: ia_sdr
    # A API fala com o banco pela rede interna do compose; esta porta serve
    # só para você abrir um cliente SQL do host. 5433 por padrão, porque a
    # 5432 costuma já estar ocupada por um Postgres local — mude com DB_PORT.
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_sdr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ia_sdr:ia_sdr@db:5432/ia_sdr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # Migrations rodam na subida: o schema e as políticas de RLS vêm juntos.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
