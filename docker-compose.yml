services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ia_sdr
      POSTGRES_PASSWORD: ia_sdr
      POSTGRES_DB: ia_sdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_sdr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://ia_sdr:ia_sdr@db:5432/ia_sdr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Migrations rodam na subida: o schema e as políticas de RLS vêm juntos.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
