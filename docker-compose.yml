services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ia_sdr
      POSTGRES_PASSWORD: ia_sdr
      POSTGRES_DB: ia_sdr
    # A API fala com o banco pela rede interna do compose; esta porta serve
    # só para você abrir um cliente SQL do host. 5433 por padrão, porque a
    # 5432 costuma já estar ocupada por um Postgres local — mude com DB_PORT.
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_sdr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # O POSTGRES_USER da imagem oficial é superusuário — e superusuário
      # ignora RLS. Ele fica só no caminho administrativo; a aplicação conecta
      # com um role sem privilégio, criado pelo bootstrap na subida.
      DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@db:5432/ia_sdr
      DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@db:5432/ia_sdr
      # Vem do .env do backend ou do ambiente do host; nunca do repositório.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # Na subida: schema e políticas de RLS (migrations), depois o role de
    # aplicação com seus privilégios mínimos. Ambos idempotentes.
    command: >
      sh -c "alembic upgrade head
      && python -m scripts.bootstrap_roles
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./web
    environment:
      # O browser nunca fala com a API direto: quem chama é o servidor do Next.
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
