name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia_sdr
          POSTGRES_PASSWORD: ia_sdr
          POSTGRES_DB: ia_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # O backend compartilhado do limitador de requisições. Sem ele, os testes
      # de `test_limitador_compartilhado.py` se pulam sozinhos — e um backend
      # pulado no CI é um backend que ninguém verifica, que é como um freio que
      # só existe na documentação.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # O usuário da imagem do Postgres é superusuário: serve de administrador.
      # A aplicação e a suíte usam o role sem privilégio, como em produção.
      DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr
      DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr_test
      TEST_DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr_test
      # Banco 15, que a suíte limpa: não esbarra em nada que o serviço tenha no 0.
      REDIS_TEST_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Migrations aplicam e revertem
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Role de aplicação sem privilégio de ignorar RLS
        working-directory: backend
        run: python -m scripts.bootstrap_roles

      - name: Testes
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia_sdr
          POSTGRES_PASSWORD: ia_sdr
          POSTGRES_DB: ia_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr
      DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr
      JWT_SECRET: ci-secret
      SECRETS_ENCRYPTION_KEY: ci-encryption-key
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
      # A fumaça percorre as dezenove telas em menos de um minuto, e cada tela
      # faz várias chamadas do servidor do Next: a execução inteira passa de 300
      # requisições com o mesmo token, que é exatamente o teto de produção por
      # janela de 60s. No runner, rápido, tudo cai na mesma janela e o limitador
      # começa a recusar — e o teste acusava a tela em que a cota acabou, não o
      # limite. Aqui é a mesma decisão que a suíte de testes já toma no conftest:
      # navegador dirigido em velocidade de máquina não é o tráfego que esse
      # freio existe para moldar, e ele tem testes próprios em test_rate_limit.py.
      RATE_LIMIT_REQUESTS: "10000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Preparar backend
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m scripts.bootstrap_roles
          python -m scripts.seed_demo
          # O painel da plataforma só existe para quem tem a marca, e ela é
          # concedida por linha de comando. Sem isto, a fumaça só conseguiria
          # verificar a recusa — que é metade do que importa.
          python -m scripts.promover_admin --email owner@apymine.com

      - name: Subir API
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health/ready && break || sleep 1
          done

      - name: Subir web
        working-directory: web
        run: |
          npm ci
          npm run build
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login && break || sleep 1
          done

      - name: Fumaça no browser
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  deploy-config:
    # As verificações baratas da publicação: compose resolve, scripts sem erro
    # de sintaxe, shellcheck. Erro de digitação em nome de variável aqui só
    # apareceria no servidor de alguém, no meio de uma publicação. O job `stack`
    # abaixo é o que sobe tudo de verdade.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose de produção resolve
        working-directory: deploy
        env:
          DOMAIN: app.exemplo.com
          ACME_EMAIL: voce@exemplo.com
          DB_NAME: ia_sdr
          DB_ADMIN_USER: ia_sdr_admin
          DB_ADMIN_PASSWORD: ci
          APP_DB_USER: ia_sdr_app
          APP_DB_PASSWORD: ci
          JWT_SECRET: ci
          SECRETS_ENCRYPTION_KEY: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Script de publicação sem erro de sintaxe
        run: bash -n deploy/publicar.sh

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/publicar.sh deploy/validar_stack.sh

  stack:
    name: stack de produção
    # O job que faltava. Até aqui, o que se sabia da publicação era que o
    # compose resolvia; nada provava que a imagem instala, que a migration
    # aplica, que o proxy roteia, que o worker sobe ou que a aplicação
    # responde por HTTPS. "Não sobe" descoberto no servidor do cliente, no dia
    # da entrega, é o pior lugar possível para esse erro aparecer.
    #
    # Sobe a stack inteira — imagens de produção, ENVIRONMENT=production, o
    # Caddyfile de verdade — e roda por cima dela a mesma fumaça do job `e2e`.
    # A única diferença em relação a um servidor real é o certificado: o
    # domínio de validação não tem DNS público, então o Caddy assina com a CA
    # interna dele. A emissão pelo Let's Encrypt é o que nenhum CI valida.
    runs-on: ubuntu-latest
    needs: [backend, web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playwright para a fumaça
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: O domínio de validação resolve para esta máquina
        run: echo "127.0.0.1 app.validacao.test" | sudo tee -a /etc/hosts

      - name: Subir a stack de produção e validar
        run: deploy/validar_stack.sh
