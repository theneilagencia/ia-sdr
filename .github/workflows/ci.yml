name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia_sdr
          POSTGRES_PASSWORD: ia_sdr
          POSTGRES_DB: ia_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O usuário da imagem do Postgres é superusuário: serve de administrador.
      # A aplicação e a suíte usam o role sem privilégio, como em produção.
      DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr
      DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr_test
      TEST_DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Migrations aplicam e revertem
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Role de aplicação sem privilégio de ignorar RLS
        working-directory: backend
        run: python -m scripts.bootstrap_roles

      - name: Testes
        working-directory: backend
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia_sdr
          POSTGRES_PASSWORD: ia_sdr
          POSTGRES_DB: ia_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr
      DATABASE_URL: postgresql+psycopg://ia_sdr_app:ia_sdr_app@localhost:5432/ia_sdr
      JWT_SECRET: ci-secret
      SECRETS_ENCRYPTION_KEY: ci-encryption-key
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Preparar backend
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m scripts.bootstrap_roles
          python -m scripts.seed_demo

      - name: Subir API
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health/ready && break || sleep 1
          done

      - name: Subir web
        working-directory: web
        run: |
          npm ci
          npm run build
          npx next start -p 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login && break || sleep 1
          done

      - name: Fumaça no browser
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  deploy-config:
    # A stack de produção não é exercitada por nenhum teste — o que dá para
    # verificar de graça é que o compose resolve e o script não tem erro de
    # sintaxe. Erro de digitação em nome de variável aqui só apareceria no
    # servidor de alguém, no meio de uma publicação.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose de produção resolve
        working-directory: deploy
        env:
          DOMAIN: app.exemplo.com
          ACME_EMAIL: voce@exemplo.com
          DB_NAME: ia_sdr
          DB_ADMIN_USER: ia_sdr_admin
          DB_ADMIN_PASSWORD: ci
          APP_DB_USER: ia_sdr_app
          APP_DB_PASSWORD: ci
          JWT_SECRET: ci
          SECRETS_ENCRYPTION_KEY: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Script de publicação sem erro de sintaxe
        run: bash -n deploy/publicar.sh

      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck deploy/publicar.sh
