name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ia_sdr
          POSTGRES_PASSWORD: ia_sdr
          POSTGRES_DB: ia_sdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ia_sdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr
      TEST_DATABASE_URL: postgresql+psycopg://ia_sdr:ia_sdr@localhost:5432/ia_sdr_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Migrations aplicam e revertem
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Testes
        working-directory: backend
        run: pytest -q
